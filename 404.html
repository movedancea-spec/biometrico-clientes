<title>Assist</title>
<!-- Otra ruta de la dirección vieja: la misma ruta en assistdatacontrol.com. -->
<script>
  var ruta = location.pathname.replace(/^\/biometrico-clientes\/?/, "");
  if (!/^[A-Za-z0-9._\/-]*$/.test(ruta) || ruta.indexOf("..") !== -1) ruta = "";
  location.replace("https://assistdatacontrol.com/" + ruta + location.search + location.hash);
</script>
</head>
